name: Release NoLeet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CI & Build
        run: npm run ci

      - name: Package extension ZIP
        run: |
          cd dist
          zip -r ../noleet.zip ./*
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: noleet.zip
          name: NoLeet ${{ github.ref_name }}
          body: |
            ## NoLeet ${{ github.ref_name }} — Free AI-Powered LeetCode Analysis ⚡
            
            ### 📥 Download & Install Instructions
            1. Download **`noleet.zip`** below.
            2. Extract / Unzip the file on your computer.
            3. In your browser (Chrome, Brave, Edge, Arc), go to `{Browser_Name}://extensions`.
            4. Enable **Developer mode** in the top-right corner.
            5. Click **Load unpacked** in the top-left corner and select the extracted folder.
            6. Pin NoLeet to your toolbar, open any LeetCode problem, and click **✨ Analyze Code**!
          draft: false
          prerelease: false
          generate_release_notes: true
